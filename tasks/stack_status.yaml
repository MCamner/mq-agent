name: stack-status
version: "0.2"
description: |
  mq-stack status loop — collect exact local HEAD identity and GitHub required-
  check evidence for every mq-stack repo, then export the wider stack truth to
  a dated mqobsidian memory/stack-truth snapshot.

  Usage:
    mq-agent task run tasks/stack_status.yaml
    mq-agent stack status --json
    mq-agent stack export

steps:
  - name: collect
    description: Collect exact-head verification state, scopes and evidence age for all repos
    tool: stack_status
    args: {}

  - name: export
    description: Write the dated mqobsidian stack-truth snapshot
    tool: stack_export
    args: {}

  - name: repo-context
    description: Snapshot current mq-agent repo state for audit trail
    tool: repo_summary
    args:
      path: "."

verify:
  - collect step returns mq.stack-status.v2 with all mq-stack repos
  - VERIFIED is only emitted for a clean worktree with successful required checks on exact HEAD
  - missing or unavailable evidence is UNVERIFIED, never inferred from another commit
  - export step writes the dated mqobsidian stack-truth snapshot
  - no repos are mutated (all status operations are read-only)
