name: Release

# Publishing a release was a manual step, and a manual step gets skipped. Across
# the MQ stack every missing GitHub release sits in a repo that published by
# hand; the one repo that automated it has none. mq-hal shipped v2.3.0 and
# v2.4.0 as tags nobody ever released, and nothing noticed for a month.
#
# So the tag is the release. Pushing v* publishes it.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-prepared-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish prepared VERSION when its tag is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists — release preparation is already published."
            exit 0
          fi

          # Refuse to create a tag unless the changelog can provide notes for
          # exactly the version declared by VERSION.
          bash scripts/release-notes.sh "$tag" > "$RUNNER_TEMP/notes.md"

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$GITHUB_SHA"

          # Creating the ref through the API is enough for release identity. Do
          # not depend on a second workflow event being emitted; publish here
          # and let the tag-triggered path below no-op if it also fires.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Idempotent: an existing release is left exactly as it is, so
      # re-running this or repairing an old tag by hand is safe.
      #
      # This job does not wait for a human, so do NOT run `gh release create`
      # after pushing a tag — the two race and this usually wins, with a plain
      # title. The procedure is: push the tag, let this publish, then
      # `gh release edit <tag> --title "<tag> — Theme"` if a themed title is
      # wanted. Publication is the tag's job; the title is the polish.
      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is already published — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Notes come from the changelog section, never from the commit range: a
      # tag placed late makes the range describe the wrong work.
      - name: Read the release notes for this tag
        if: steps.existing.outputs.exists == 'false'
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Publish
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
