name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv pip install -e ".[dev,signal]"

      # mqobsidian owns these contracts; this repo vendors them so an installed
      # mq-agent needs no vault checkout. Blocking here, on the consumer, and
      # deliberately not mirrored in mqobsidian: two blocking cross-repo gates
      # would deadlock, each comparing against the other's unmerged branch.
      # A contract change lands in mqobsidian first; this repo goes red until
      # its copy catches up.
      - name: Check out canonical contracts
        uses: actions/checkout@v4
        with:
          repository: MCamner/mqobsidian
          ref: main
          path: .canonical-contracts

      - name: Vendored contracts match canonical
        run: uv run python scripts/check-vendored-contracts.py --canonical-root .canonical-contracts

      # The script existed but ran nowhere, so a skill could be added without
      # its SKILLS.md row or its .agents/ mirror and still show a green PR.
      # macos-scripts and mq-mcp both run this in CI; this repo did not.
      - name: Skills are consistent (frontmatter, cross-refs, paths, SKILLS.md)
        run: ./scripts/check-skills.sh

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Lint
        run: uv run ruff check --select E4,E7,E9,F mq_agent/ tests/

      - name: Type check
        run: uv run mypy mq_agent/ tests/ --ignore-missing-imports

      - name: Docs consistency
        run: bash scripts/check-docs-consistency.sh

      # The local release gate and CI drifted apart once already: mypy, the
      # vendored-contract check and the command-reference check ran in CI only,
      # and ruff linted tests/ in CI and not locally. Both gates now assert
      # they cover the same checks over the same paths.
      - name: Local gate and CI check the same things
        run: uv run python scripts/check-gate-parity.py

      # Blocking: the checked-in command reference must match the live Typer
      # app. Wiki publishing is warn-only and lives outside CI.
      - name: Command reference is current
        run: uv run python tools/generate_command_reference.py --check

  # The stack runs macOS; the job above runs ubuntu. Everything in
  # mq_agent/core/credentials.py after the `sys.platform != "darwin"` early
  # return is therefore never executed by CI — the Keychain lookup, the
  # service/account resolution, and the /usr/bin/security call. So is the
  # conftest guard that refuses a test reaching this machine's Keychain: on
  # ubuntu the code returns before subprocess.run, so a test that would reach
  # it cannot be seen. That guard can only fire here.
  #
  # This job does not duplicate the one above. It runs release-check.sh, which
  # is the canonical release gate and ran nowhere in CI until now — `mq-agent
  # stack release-check` is a different, cross-repo metadata check and never
  # invokes the script. It also carries a check the ubuntu job does not have:
  # uv.lock's mq-agent version against VERSION.
  #
  # mypy is added because release-check.sh does not run it, and the ubuntu job
  # does. Without it the two gates would disagree about what "passing" means.
  #
  # Deliberately not covered here: real process start and port binding. The
  # receiver tests monkeypatch `probe_running`, `start_receiver` and `_sleep`,
  # and nothing in the suite binds a port, so running them on macOS proves the
  # platform branch and nothing more. A test that actually starts mq-mcp is
  # worth having and belongs in its own change, where a red job means a
  # platform bug rather than a leaked child process.
  macos-runtime:
    name: macOS runtime and release gate
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      # `uv sync` rather than `uv pip install`, because the smoke scripts fall
      # back to .venv/bin/mq-agent when no mq-agent is on PATH — which is the
      # case on a runner — and sync is what guarantees that path exists. It is
      # also lockfile-faithful, which is what release-check.sh's first check
      # asserts.
      - name: Install from the lockfile
        run: uv sync --extra dev --extra signal

      # Human mode, not --json: --json always exits 0 and carries the verdict
      # in a field, so CI would go green on a BLOCKED repo.
      - name: Release gate
        run: ./release-check.sh

      - name: Type check
        run: uv run mypy mq_agent/ tests/ --ignore-missing-imports
