name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv pip install -e ".[dev,signal]"

      - name: Install repo-signal
        run: uv pip install "repo-signal @ git+https://github.com/MCamner/repo-signal.git@main"

      - name: Run tests
        run: uv run pytest -v

      - name: Lint
        run: uv run ruff check --select E4,E7,E9,F mq_agent/

      - name: Type check
        run: uv run mypy mq_agent/ tests/ --ignore-missing-imports

      - name: Docs consistency
        run: bash scripts/check-docs-consistency.sh

      # Blocking: the checked-in command reference must match the live Typer
      # app. Wiki publishing is warn-only and lives outside CI.
      - name: Command reference is current
        run: uv run python tools/generate_command_reference.py --check
