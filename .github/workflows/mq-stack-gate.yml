name: MQ Stack Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, isolated gate for pull requests: only the checkout itself is
  # validated; sibling repos are SKIPPED so unrelated drift in another
  # stack repo cannot fail an mq-agent PR.
  pr-gate:
    name: Contract and release gates (CI mode)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mq-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Stack contract gate
        run: mq-agent stack contract-check --ci --json

      - name: Stack release gate
        run: mq-agent stack release-check --ci --json

  # Full-stack gate for pushes to main, nightly runs, and manual dispatch:
  # checks out every MQ stack repo and validates the whole stack.
  full-stack-gate:
    name: Contract and release gates
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out mq-agent
        uses: actions/checkout@v4
        with:
          path: mq-agent

      - name: Check out macos-scripts
        uses: actions/checkout@v4
        with:
          repository: MCamner/macos-scripts
          path: macos-scripts

      - name: Check out mq-mcp
        uses: actions/checkout@v4
        with:
          repository: MCamner/mq-mcp
          path: mq-mcp

      - name: Check out repo-signal
        uses: actions/checkout@v4
        with:
          repository: MCamner/repo-signal
          path: repo-signal

      - name: Check out mq-hal
        uses: actions/checkout@v4
        with:
          repository: MCamner/mq-hal
          path: mq-hal

      - name: Check out mq-image-analyze
        uses: actions/checkout@v4
        with:
          repository: MCamner/mq-image-analyze
          path: mq-image-analyze

      - name: Check out mq-ums
        uses: actions/checkout@v4
        with:
          repository: MCamner/mq-ums
          path: mq-ums

      - name: Check out mqobsidian
        uses: actions/checkout@v4
        with:
          repository: MCamner/mqobsidian
          path: mqobsidian

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The fresh-resolve step below shells out to uv. Without it the check
      # reports MQC010_TOOL_UNAVAILABLE and exits 3 — a red job every night for
      # a missing binary rather than a real incompatibility.
      - uses: astral-sh/setup-uv@v5

      - name: Install mq-agent
        working-directory: mq-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Link MQ stack repos into expected home layout
        run: |
          ln -s "$GITHUB_WORKSPACE/macos-scripts" "$HOME/macos-scripts"
          ln -s "$GITHUB_WORKSPACE/mq-agent" "$HOME/mq-agent"
          ln -s "$GITHUB_WORKSPACE/mq-mcp" "$HOME/mq-mcp"
          ln -s "$GITHUB_WORKSPACE/repo-signal" "$HOME/repo-signal"
          ln -s "$GITHUB_WORKSPACE/mq-hal" "$HOME/mq-hal"
          ln -s "$GITHUB_WORKSPACE/mq-image-analyze" "$HOME/mq-image-analyze"
          ln -s "$GITHUB_WORKSPACE/mq-ums" "$HOME/mq-ums"
          ln -s "$GITHUB_WORKSPACE/mqobsidian" "$HOME/mqobsidian"

      - name: Run stack contract gate
        working-directory: mq-agent
        run: mq-agent stack contract-check --json

      - name: Run stack release gate
        working-directory: mq-agent
        run: mq-agent stack release-check --json

      # Static: reads declared and locked versions only. `--all` inventories
      # every repo checked out above rather than the MCP slice, so a FAIL here
      # is a real cross-repo incompatibility. WARN stays green while repos are
      # still declaring their boundary.
      - name: Run stack compatibility gate
        working-directory: mq-agent
        run: mq-agent stack compatibility --all --json

      # Dynamic: what a fresh install would select today, which no lockfile can
      # answer. Needs a registry, so it is kept off pull requests and runs on
      # the nightly schedule and on manual dispatch. Exit 3 (UNAVAILABLE) fails
      # the job on purpose: a check that could not run is not a passing check.
      - name: Run fresh dependency resolution
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: mq-agent
        run: mq-agent stack compatibility --all --fresh-resolve --json
