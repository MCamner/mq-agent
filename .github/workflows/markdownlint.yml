name: Markdownlint

on:
  workflow_dispatch:
  # Scoped to main: a bare `push:` also fires on feature branches, so a branch
  # with an open PR reports two check runs under the same name on one SHA, and
  # required status checks match on the name while ignoring the event. Pushes
  # to main stay post-merge verification, as in install-smoke.yml.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Reads rules from .markdownlint.json and scope (globs/ignores) from
      # .markdownlint-cli2.jsonc, so CI matches local `markdownlint-cli2`.
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
