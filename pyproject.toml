[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mq-agent"
version = "0.4.0"
description = "Terminal-native AI agent orchestrator for the mq ecosystem"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "typer>=0.12.0",
    "textual>=0.50.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mq-agent = "mq_agent.main:app"

[project.optional-dependencies]
signal = [
    "repo-signal>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mq_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["tests/"]
