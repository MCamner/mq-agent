[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mq-agent"
version = "1.25.1"
description = "Terminal-native workflow orchestration runtime for the mq ecosystem"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "typer>=0.12.0",
    "textual>=0.50.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.23.0",
]

[project.scripts]
mq-agent = "mq_agent.main:app"

[project.optional-dependencies]
signal = [
    "repo-signal>=0.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["mq_agent"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/mq_stack_repo_contract.schema.json" = "mq_agent/schemas/mq_stack_repo_contract.schema.json"
"schemas/model_route_decision.schema.json" = "mq_agent/schemas/model_route_decision.schema.json"
"schemas/model_route_outcome.schema.json" = "mq_agent/schemas/model_route_outcome.schema.json"
"schemas/model_route_evidence_review.schema.json" = "mq_agent/schemas/model_route_evidence_review.schema.json"
"schemas/mq_release_cockpit.schema.json" = "mq_agent/schemas/mq_release_cockpit.schema.json"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "repo_signal.*"
ignore_missing_imports = true
